{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Grading In Progress</h2>
    <div class="progress-text" id="progressText">Preparing...</div>
    <div class="progress-container">
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
        </div>
    </div>
    <ul class="log-list" id="logList"></ul>
</div>

<div id="fatalError" class="alert alert-error" style="display:none;"></div>

<div style="text-align: center; margin-top: 1rem;">
    <a href="/" class="btn btn-secondary" id="cancelBtn">Cancel &amp; Start Over</a>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/processing.js') }}"></script>
{% endblock %}
